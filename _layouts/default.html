<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.map %}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">{% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="wrap-left">
        <a class="brand" href="{{ '/' | relative_url }}">
          <svg class="brand-mark" viewBox="0 0 36 36" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="10.8" r="9"/><circle cx="12.2" cy="21.6" r="9"/><circle cx="23.8" cy="21.6" r="9"/></svg>
          Landers On Tour
        </a>
        <nav class="site-nav"><a href="{{ '/shows/' | relative_url }}">Shows</a></nav>
      </div>
      <span class="tag">Family archive · unlisted</span>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    Landers On Tour, built with Jekyll &amp; GitHub Pages. &middot; <a href="{{ '/admin/' | relative_url }}">Trip admin</a>
  </footer>
</body>
</html>
