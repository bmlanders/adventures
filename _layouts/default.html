<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="mark"></span>Landers On Tour</a>
      <span class="tag">Family archive · unlisted</span>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    Landers On Tour — built with Jekyll &amp; GitHub Pages. &middot; <a href="{{ '/admin/' | relative_url }}">Trip admin</a>
  </footer>
</body>
</html>
